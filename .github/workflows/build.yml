name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Install Android SDK
      run: |
        wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
        unzip commandlinetools-linux-9477386_latest.zip -d $HOME/android-sdk
        mkdir -p $HOME/android-sdk/cmdline-tools/latest
        mv $HOME/android-sdk/cmdline-tools/bin $HOME/android-sdk/cmdline-tools/lib $HOME/android-sdk/cmdline-tools/NOTICE.txt $HOME/android-sdk/cmdline-tools/source.properties $HOME/android-sdk/cmdline-tools/latest/
        export ANDROID_HOME=$HOME/android-sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
        export PATH=$PATH:$ANDROID_HOME/build-tools/33.0.2
        yes | sdkmanager "platforms;android-33" "build-tools;33.0.2"
        echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$ANDROID_HOME/build-tools/33.0.2" >> $GITHUB_PATH
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
    - name: Build APK
      run: |
        mkdir -p build/src/com/kanha/chesshack build/assets
        
        MANIFEST=$(find . -name "AndroidManifest.xml" | head -n 1)
        JAVA_FILE=$(find . -name "MainActivity.java" | head -n 1)
        JS_FILE=$(find . -name "*.js" | head -n 1)
        
        cp "$MANIFEST" build/AndroidManifest.xml
        cp "$JAVA_FILE" build/src/com/kanha/chesshack/MainActivity.java
        cp "$JS_FILE" build/assets/hack.js
        
        cd build
        
        # إصلاح أسماء الحزم تلقائياً
        sed -i 's/package .*/package com.kanha.chesshack;/g' src/com/kanha/chesshack/MainActivity.java
        sed -i 's/package=".*"/package="com.kanha.chesshack"/g' AndroidManifest.xml
        
        # إضافة إصدارات الأندرويد (minSdk و targetSdk) عشان يتوافق مع كل الجوالات
        if ! grep -q "uses-sdk" AndroidManifest.xml; then
          sed -i 's|<application|<uses-sdk android:minSdkVersion="21" android:targetSdkVersion="33" />\n    <application|' AndroidManifest.xml
        fi
        
        # البناء
        javac -source 1.8 -target 1.8 -cp $ANDROID_HOME/platforms/android-33/android.jar -d obj src/com/kanha/chesshack/MainActivity.java
        d8 --lib $ANDROID_HOME/platforms/android-33/android.jar --output . obj/com/kanha/chesshack/*.class
        aapt package -f -M AndroidManifest.xml -I $ANDROID_HOME/platforms/android-33/android.jar -F app.apk
        aapt add app.apk classes.dex
        aapt add app.apk assets/hack.js
        
        # محاذاة الملف (zipalign) وتوقيعه بكل الإصدارات (v1, v2, v3)
        zipalign -v 4 app.apk app-aligned.apk
        keytool -genkey -v -keystore my.keystore -alias mykey -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=Android"
        apksigner sign --ks my.keystore --ks-pass pass:password --key-pass pass:password --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out ChessHack.apk app-aligned.apk
        
        mkdir -p $GITHUB_WORKSPACE/output
        cp ChessHack.apk $GITHUB_WORKSPACE/output/
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Chess-App
        path: output/ChessHack.apk
